# MOJI UX 테스트 — nginx 설정
#
# 화면(정적 파일)과 API 를 **같은 오리진**으로 묶는다. 그래서 브라우저가
# CORS 를 따지지 않고, 서버(app/main.py)의 허용 목록을 건드릴 일도 없다.
#
#   /        → /var/www/moji      (web/dist 를 올린 곳)
#   /api/    → 127.0.0.1:8000     (uvicorn)

server {
    # default_server 라서 이름이 안 맞는 요청(=IP 로 직접 접속)도 여기로 온다.
    # 그래서 도메인이 붙기 전에도, 붙은 뒤에도 둘 다 열린다.
    listen 80 default_server;
    listen [::]:80 default_server;

    # certbot 이 이 목록을 보고 인증서를 발급한다. 비워 두면 못 찾는다.
    server_name unithon-deodmi.site www.unithon-deodmi.site;

    root /var/www/moji;
    index index.html;

    # 업로드한 화면 사진(위키백과 폴백 등)이 253KB 다. 여유를 준다.
    client_max_body_size 20m;

    # API 는 뒤쪽 uvicorn 으로 넘긴다.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 썸네일은 헤드리스 크로미움이 실제로 사이트를 열어 찍는다.
        # 기본 60초로는 느린 사이트에서 끊긴다.
        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }

    # 서버 상태 확인용.
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # SPA 폴백. 이 줄이 없으면 /settings/plan 같은 주소를 **새로고침하는 순간
    # 404** 가 난다 — 라우팅을 브라우저가 하기 때문에 서버에는 그 파일이 없다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 파일명에 해시가 붙는 자산은 영구 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 만은 절대 캐시하지 않는다. 캐시되면 새 배포가 반영되지 않고
    # 옛 index 가 사라진 해시 파일을 찾아 흰 화면이 된다.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
}
