<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문이 완료되었습니다 — MOJI STORE</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<a class="skip-link" href="#main">본문 바로가기</a>

<div class="topbar">5만원 이상 구매 시 무료배송 · 30일 이내 무료 반품</div>

<header class="header">
  <div class="wrap header__inner">
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="메뉴 열기">☰</button>
    <a class="logo" href="index.html">MOJI</a>
    <nav class="nav" id="main-nav" aria-label="주 메뉴">
      <a href="index.html">홈</a>
      <a href="list.html">전체 상품</a>
    </nav>
    <div class="header__actions">
      <a class="icon-btn" href="cart.html">
        <span aria-hidden="true">🛒</span>
        <span aria-hidden="true">장바구니</span>
        <span class="cart-count" data-cart-count hidden aria-hidden="true">0</span>
        <span class="sr-only" data-cart-label>장바구니 (비어 있음)</span>
      </a>
    </div>
  </div>
</header>

<main id="main" class="wrap">
  <p class="steps">장바구니 › 주문/결제 › <b>주문 완료 (3/3)</b></p>
  <div id="done-root"></div>
</main>

<footer class="footer">
  <div class="wrap">
    <p class="footer__legal" style="margin-top:0; border:0; padding:0;">
      (주)모지스토어 · 본 사이트는 UX 검증 서비스 테스트를 위한 가상의 쇼핑몰입니다.
    </p>
  </div>
</footer>

<script src="../shared/products.js"></script>
<script src="assets/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const root = document.getElementById("done-root");
  let order = null;
  try { order = JSON.parse(sessionStorage.getItem("moji_last_order")); } catch {}

  if (!order) {
    root.innerHTML = `
      <div class="empty">
        <h2>표시할 주문 정보가 없습니다</h2>
        <p>주문 내역은 이메일로 보내드린 주문번호로 조회하실 수 있습니다.</p>
        <a class="btn btn--primary btn--lg" href="list.html">쇼핑 계속하기</a>
      </div>`;
    return;
  }

  root.innerHTML = `
    <div class="done">
      <div class="done__icon" aria-hidden="true">✓</div>
      <h1>주문이 완료되었습니다</h1>
      <p>${order.name}님, 주문해 주셔서 감사합니다.</p>
      <p>주문 확인 메일을 <strong>${order.email}</strong>으로 보내드렸습니다.</p>

      <div class="order-box">
        <dl>
          <dt>주문번호</dt><dd>${order.no}</dd>
          <dt>결제 금액</dt><dd>${won(order.total)}</dd>
          <dt>주문 수량</dt><dd>${order.count}개</dd>
          <dt>배송지</dt><dd>${order.addr || "-"}</dd>
          <dt>도착 예정</dt><dd>결제일로부터 2-3일 이내</dd>
        </dl>
      </div>

      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <a class="btn btn--ghost" href="#">주문 상세 보기</a>
        <a class="btn btn--primary" href="list.html">쇼핑 계속하기</a>
      </div>
      <p class="hint" style="margin-top:22px;">주문 후 30분 이내에는 고객센터를 통해 무료로 취소하실 수 있습니다.</p>
    </div>`;
});
</script>
</body>
</html>
