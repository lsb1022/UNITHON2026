<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>쇼핑몰</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="topbar">이벤트 진행중</div>

<div class="header">
  <div class="wrap header-inner">
    <span class="logo">MOJI</span>
    <div class="nav">
      <a href="index.html">홈</a>
      <a href="list.html">전체</a>
      <a href="list.html?cat=상의">상의</a>
      <a href="list.html?cat=하의">하의</a>
      <a href="list.html?cat=신발">신발</a>
      <a href="list.html?cat=액세서리">액세서리</a>
    </div>
    <a class="cart-link" href="cart.html">cart</a>
  </div>
</div>

<div class="wrap" style="padding:14px 0">
  <span style="font-size:12px; color:#c0c0c0">장바구니</span>
  <div id="cart-root" style="margin-top:8px"></div>
</div>

<div class="footer">
  <div class="wrap">
    <div class="footer-links">
      <a href="#">이용약관</a>
      <a href="#">개인정보처리방침</a>
      <a href="#">고객센터</a>
    </div>
    <p>(주)모지스토어 · 본 사이트는 UX 검증 서비스 테스트를 위한 가상의 쇼핑몰입니다.</p>
  </div>
</div>

<script src="../shared/products.js"></script>
<script src="assets/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const root = document.getElementById("cart-root");

  function render() {
    const cart = getCart();

    /* [D-55] 장바구니가 비었을 때 안내 문구도, 상품을 보러 갈 링크도 없다.
       표 헤더만 남은 사실상의 빈 화면이 된다. */
    const subtotal = cartSubtotal();

    root.innerHTML = `
      <table class="cart-table">
        <thead>
          <tr><th></th><th>상품</th><th>옵션</th><th>수량</th><th>금액</th><th></th></tr>
        </thead>
        <tbody>
        ${cart.map((l) => `
          <tr>
            <!-- [D-37] alt 없음 -->
            <td><img src="../shared/img/p${l.id}.svg"></td>
            <td>${l.name}</td>
            <!-- [D-52] 옵션 미선택 시 null이 그대로 노출된다 -->
            <td>${l.color} / ${l.size}</td>
            <td>
              <span class="qty">
                <!-- [D-53] 접근 가능한 이름 없음, 18×14px -->
                <button data-act="dec" data-key="${l.key}">-</button>
                <input value="${l.qty}" data-act="set" data-key="${l.key}">
                <button data-act="inc" data-key="${l.key}">+</button>
              </span>
            </td>
            <!-- [D-16] 통화 단위 없음 -->
            <td>${num(l.price * l.qty)}</td>
            <!-- [D-22] 8px 'x' 한 글자, 확인도 실행취소도 없이 즉시 삭제 -->
            <td><span class="del-x" data-act="del" data-key="${l.key}">x</span></td>
          </tr>`).join("")}
        </tbody>
      </table>

      <!-- [D-33] 배송비 줄이 없다. 여기 표시된 금액이 최종 결제 금액처럼 보이지만
           결제 단계에서 5000이 조용히 추가된다. -->
      <div class="total-row">합계 ${num(subtotal)}</div>

      <div style="text-align:right">
        <!-- [D-13] "확인"만 있고 무엇으로 넘어가는지 알 수 없다
             [D-56] 쇼핑 계속하기 등 되돌아갈 경로가 없다 -->
        <a class="btn btn-primary" href="checkout.html">확인</a>
      </div>`;
  }

  root.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const key = el.dataset.key;
    const line = getCart().find((l) => l.key === key);
    if (!line) return;

    if (el.dataset.act === "inc") { updateQty(key, line.qty + 1); render(); }
    if (el.dataset.act === "dec") { updateQty(key, line.qty - 1); render(); }
    if (el.dataset.act === "del") { removeLine(key); render(); }   // 즉시 삭제
  });

  root.addEventListener("change", (e) => {
    const input = e.target.closest('input[data-act="set"]');
    if (!input) return;
    /* [D-36] 숫자 검증 없음 — 문자를 넣으면 NaN이 되어 합계가 깨진다 */
    updateQty(input.dataset.key, parseInt(input.value, 10));
    render();
  });

  render();
});
</script>
</body>
</html>
