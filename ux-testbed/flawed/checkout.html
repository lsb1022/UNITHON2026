<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>쇼핑몰</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="topbar">이벤트 진행중</div>

<div class="header">
  <div class="wrap header-inner">
    <span class="logo">MOJI</span>
    <div class="nav">
      <a href="index.html">홈</a>
      <a href="list.html">전체</a>
      <a href="cart.html">장바구니</a>
    </div>
    <a class="cart-link" href="cart.html">cart</a>
  </div>
</div>

<div class="wrap" style="padding:14px 0">
  <!-- [D-57] 결제 단계 표시(2/3 등)가 없어 앞으로 몇 단계가 남았는지 알 수 없다 -->
  <span style="font-size:12px; color:#c0c0c0">주문</span>
  <div id="checkout-root" style="margin-top:8px"></div>
</div>

<div class="footer">
  <div class="wrap">
    <div class="footer-links">
      <a href="#">이용약관</a>
      <a href="#">개인정보처리방침</a>
      <a href="#">고객센터</a>
    </div>
    <p>(주)모지스토어 · 본 사이트는 UX 검증 서비스 테스트를 위한 가상의 쇼핑몰입니다.</p>
  </div>
</div>

<script src="../shared/products.js"></script>
<script src="assets/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const root = document.getElementById("checkout-root");
  const cart = getCart();
  const subtotal = cartSubtotal();

  /* [D-33] 여기서 처음으로 배송비 5000이 등장한다.
     상품 상세에도, 장바구니에도 고지가 없었다. */
  const total = subtotal + (subtotal > 0 ? HIDDEN_SHIP_FEE : 0);

  root.innerHTML = `
  <form id="order-form">
    <!-- [D-58] 비회원 구매 경로가 없다. 주문하려면 반드시 계정을 만들어야 한다. -->
    <div style="font-size:10px; color:#cbcbcb; margin-bottom:8px">
      주문하려면 회원가입이 필요합니다.
    </div>

    <!-- [D-08] label 요소가 하나도 없다. placeholder만으로 필드를 구분해야 하며,
         입력을 시작하면 그 힌트마저 사라진다.
         [D-59] 어떤 항목이 필수인지 표시가 없다. -->
    <div class="form-row">
      <input class="inp" id="name"  placeholder="이름">
      <input class="inp" id="phone" placeholder="연락처">
      <div class="form-full"><input class="inp" id="email" placeholder="이메일"></div>
      <div class="form-full"><input class="inp" id="pw" type="password" placeholder="비밀번호"></div>
      <!-- [D-60] 비밀번호 규칙을 미리 알려주지 않는다 (제출 후에도 알려주지 않는다) -->

      <!-- [D-61] 우편번호 검색 없이 주소를 한 줄에 직접 입력해야 한다 -->
      <div class="form-full"><input class="inp" id="addr" placeholder="주소"></div>
    </div>

    <div style="margin:10px 0">
      <!-- [D-24] 10px 체크박스
           [D-25] 마케팅 수신 동의가 기본 체크 + 흐린 회색 (다크 패턴) -->
      <div class="chk-row">
        <input type="checkbox" class="chk" id="agree1"> 이용약관에 동의합니다
      </div>
      <div class="chk-row muted">
        <input type="checkbox" class="chk" id="agree2" checked> 마케팅 정보 수신에 동의합니다
      </div>
    </div>

    <!-- [D-62] 주문 요약(어떤 상품을 몇 개 사는지)이 결제 화면에 없다 -->
    <div class="total-row">
      결제금액 ${num(total)}
    </div>

    <div style="text-align:right">
      <!-- [D-10] div 가짜 버튼 — form submit도 아니고 키보드로 누를 수도 없다 -->
      <div class="fake-btn" id="pay">확인</div>
    </div>
  </form>`;

  document.getElementById("pay").addEventListener("click", () => {
    const name  = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const email = document.getElementById("email").value.trim();
    const pw    = document.getElementById("pw").value;
    const addr  = document.getElementById("addr").value.trim();
    const agree = document.getElementById("agree1").checked;

    /* [D-63] 검증에 실패해도 에러 메시지를 표시하지 않는다.
       버튼을 눌러도 아무 일이 일어나지 않아 고장난 것처럼 보인다. */
    /* [D-64] 실패 시 입력값을 모두 초기화한다 — 처음부터 다시 입력해야 한다. */
    const ok = name && /^01\d{8,9}$/.test(phone.replace(/\D/g, "")) &&
               /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) && pw.length >= 8 && addr && agree;

    if (!ok) {
      document.getElementById("order-form").reset();
      return;   // 조용히 종료
    }

    /* [D-65] 로딩 표시가 없다. 2초간 아무 반응이 없어 사용자는 버튼을 다시 누르게 된다.
       중복 클릭을 막는 처리도 없다. */
    setTimeout(() => {
      sessionStorage.setItem("moji_last_order_flawed", JSON.stringify({
        no: "MOJI-" + String(100000 + Math.floor(Math.random() * 899999)),
        total: total
      }));
      saveCart([]);
      location.href = "complete.html";
    }, 2000);
  });
});
</script>
</body>
</html>
