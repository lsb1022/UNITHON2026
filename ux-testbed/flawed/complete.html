<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>쇼핑몰</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="topbar">이벤트 진행중</div>

<div class="header">
  <div class="wrap header-inner">
    <span class="logo">MOJI</span>
    <div class="nav">
      <a href="index.html">홈</a>
      <a href="list.html">전체</a>
    </div>
    <a class="cart-link" href="cart.html">cart</a>
  </div>
</div>

<div class="wrap" style="padding:40px 0; min-height:180px">
  <div id="done-root"></div>
</div>

<div class="footer">
  <div class="wrap">
    <div class="footer-links">
      <a href="#">이용약관</a>
      <a href="#">개인정보처리방침</a>
      <a href="#">고객센터</a>
    </div>
    <p>(주)모지스토어 · 본 사이트는 UX 검증 서비스 테스트를 위한 가상의 쇼핑몰입니다.</p>
  </div>
</div>

<script src="../shared/products.js"></script>
<script src="assets/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const root = document.getElementById("done-root");
  let order = null;
  try { order = JSON.parse(sessionStorage.getItem("moji_last_order_flawed")); } catch {}

  /* [D-66] 주문 정보가 없으면 빈 화면. 안내도 링크도 없다. */
  if (!order) return;

  /* [D-67] 완료 화면에 성공을 알리는 시각적 신호가 없다.
     주문번호·배송 예정일·다음에 할 일(쇼핑 계속하기, 주문 조회)이 모두 빠져 있다.
     [D-16] 금액에 통화 단위가 없다. */
  root.innerHTML = `
    <div style="font-size:11px; color:#c5c5c5">
      주문이 접수되었습니다. ${num(order.total)}
    </div>`;
});
</script>
</body>
</html>
